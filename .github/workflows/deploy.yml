name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Optional, privacy-conscious integrations. Absent -> app ships
          # inert (no tracking). Add a repo Secret / Variable to enable.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_SRC: ${{ vars.VITE_PLAUSIBLE_SRC }}

      # ---- version3.0 preview at /v3/ (non-blocking) ----
      # Built here because the github-pages environment only permits
      # deployments from main. Every step is continue-on-error, so a broken
      # preview can never block or alter the live site at the root.
      - name: Checkout version3.0 (preview)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: version3.0
          path: v3-src

      - name: Build version3.0 preview
        continue-on-error: true
        working-directory: v3-src
        run: |
          npm ci
          npm run build -- --base=/Tovo/v3/
          mkdir -p ../dist/v3
          cp -r dist/. ../dist/v3/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # The Pages deploy step fails transiently now and then; retry once
      # before failing the run for real.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry deploy (transient Pages failures)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
